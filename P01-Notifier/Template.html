<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Terkirim</title>
</head>
<body style="margin: 0; padding: 0; background-color: #e0f2fe; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">

    <!-- Wrapper Utama -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #e0f2fe; padding: 40px 0;">
        <tr>
            <td align="center">
                
                <!-- Card Container (Baby Blue & Soft Off-White Theme) -->
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 440px; background-color: #f8fafc; border-radius: 16px; border: 1px solid #bae6fd; border-top: 4px solid #0284c7; padding: 36px 28px; box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04);">
                    
                    <!-- Header Title H1 -->
                    <tr>
                        <td align="left" style="padding-bottom: 12px;">
                            <h1 style="color: #0369a1; font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.3px;">SUKSES</h1>
                        </td>
                    </tr>

                    <!-- Teks Konteks Utama -->
                    <tr>
                        <td align="left" style="color: #334155; font-size: 14px; line-height: 1.6; padding-bottom: 24px;">
                            Selamat! Kamu telah berhasil mengirimkan email ini secara langsung melalui aplikasi menggunakan framework <strong>.NET</strong>.
                        </td>
                    </tr>

                    <!-- Tag Pill Tanggal Dikirim (Sesuai gaya elemen bawah pada contoh gambar) -->
                    <tr>
                        <td align="left" style="padding-top: 8px;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="background-color: #e0f2fe; border: 1px solid #bae6fd; border-radius: 20px; padding: 6px 14px; color: #0369a1; font-size: 12px; font-weight: 600;">
                                        📅 &nbsp;Dikirim pada: {DATE_TIME}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
                <!-- End Card Container -->

            </td>
        </tr>
    </table>
    <!-- End Wrapper -->

</body>
</html>
